# SiGeRU - configuración del servicio SSH
# Se instala como /etc/ssh/sshd_config.d/00-sigeru.conf: al leerse primero,
# sus valores tienen prioridad sobre el resto de la configuración.
Port {{PUERTO_SSH}}
PermitRootLogin no
PubkeyAuthentication yes
PasswordAuthentication {{PASSWORD_AUTH}}
PermitEmptyPasswords no
KbdInteractiveAuthentication no
AllowGroups sigeru-ssh
MaxAuthTries 3
LoginGraceTime 30
MaxSessions 4
ClientAliveInterval 300
ClientAliveCountMax 2
X11Forwarding no
AllowTcpForwarding no
AllowAgentForwarding no
PermitTunnel no
Banner /etc/issue.net
LogLevel VERBOSE
