# =====================================================================
# SiGeRU - despliegue en el servidor de aplicaciones (sigeru-app)
#
#   cd /opt/aplec/sigeru/sigeru-infra/docker
#   docker compose up -d --build
#
# Antes hay que generar el archivo .env, las claves JWT y el certificado
# (lo hace la opción "Instalación" del script sigeru-admin).
# La base de datos no corre acá: está en el servidor sigeru-bd.
# =====================================================================
name: sigeru

x-logs: &logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# Variables comunes a los servicios PHP
x-entorno: &entorno
  APP_IDIOMA: es
  CONFIAR_PROXY: "1"
  COOKIE_SEGURA: "1"
  DB_HOST: ${DB_HOST:-192.168.56.20}
  DB_PORT: ${DB_PORT:-3306}
  DB_NAME: ${DB_NAME:-sigeru}
  JWT_CLAVE_PUBLICA: /claves/jwt_publica.pem
  # solo para demostraciones y pruebas con los datos de prueba; vacía, el sistema usa la fecha real
  FECHA_SIMULADA: ${FECHA_SIMULADA:-}

services:
  # Único punto de entrada: HTTPS y reparto de peticiones a cada contenedor
  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./gateway/sigeru.conf:/etc/nginx/conf.d/default.conf:ro,z
      - ./gateway/certs:/etc/nginx/certs:ro,z
    depends_on: [landing, frontend, api-usuarios, api-gestion, api-recoleccion, backoffice]
    networks: [frontal, aplicaciones]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/salud"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *logs

  landing:
    build: ../../sigeru-landing
    image: aplec/sigeru-landing:${VERSION:-1.0.0}
    restart: unless-stopped
    networks: [aplicaciones]
    logging: *logs

  frontend:
    build: ../../sigeru-frontend
    image: aplec/sigeru-frontend:${VERSION:-1.0.0}
    restart: unless-stopped
    networks: [aplicaciones]
    logging: *logs

  api-usuarios:
    build: ../../sigeru-api-usuarios
    image: aplec/sigeru-api-usuarios:${VERSION:-1.0.0}
    restart: unless-stopped
    environment:
      <<: *entorno
      APP_NOMBRE: api-usuarios
      DB_USER: api_usuarios
      DB_PASS: ${CLAVE_API_USUARIOS:?Falta CLAVE_API_USUARIOS en .env}
      JWT_CLAVE_PRIVADA: /claves/jwt_privada.pem
      LOG_ARCHIVO: /var/log/sigeru/api-usuarios-{fecha}.log
    volumes:
      - ./claves:/claves:ro,z
      - /var/log/sigeru/aplicaciones:/var/log/sigeru:z
    networks: [aplicaciones, datos]
    logging: *logs

  api-gestion:
    build: ../../sigeru-api-gestion
    image: aplec/sigeru-api-gestion:${VERSION:-1.0.0}
    restart: unless-stopped
    environment:
      <<: *entorno
      APP_NOMBRE: api-gestion
      APP_SAL: ${APP_SAL:?Falta APP_SAL en .env}
      DB_USER: api_gestion
      DB_PASS: ${CLAVE_API_GESTION:?Falta CLAVE_API_GESTION en .env}
      LOG_ARCHIVO: /var/log/sigeru/api-gestion-{fecha}.log
    volumes:
      - ./claves/jwt_publica.pem:/claves/jwt_publica.pem:ro,z
      - /var/log/sigeru/aplicaciones:/var/log/sigeru:z
    networks: [aplicaciones, datos]
    logging: *logs

  api-recoleccion:
    build: ../../sigeru-api-recoleccion
    image: aplec/sigeru-api-recoleccion:${VERSION:-1.0.0}
    restart: unless-stopped
    environment:
      <<: *entorno
      APP_NOMBRE: api-recoleccion
      DB_USER: api_recoleccion
      DB_PASS: ${CLAVE_API_RECOLECCION:?Falta CLAVE_API_RECOLECCION en .env}
      LOG_ARCHIVO: /var/log/sigeru/api-recoleccion-{fecha}.log
    volumes:
      - ./claves/jwt_publica.pem:/claves/jwt_publica.pem:ro,z
      - /var/log/sigeru/aplicaciones:/var/log/sigeru:z
    networks: [aplicaciones, datos]
    logging: *logs

  backoffice:
    build: ../../sigeru-backoffice
    image: aplec/sigeru-backoffice:${VERSION:-1.0.0}
    restart: unless-stopped
    environment:
      <<: *entorno
      APP_NOMBRE: backoffice
      BASE_PATH: /backoffice
      DB_USER: backoffice
      DB_PASS: ${CLAVE_BACKOFFICE:?Falta CLAVE_BACKOFFICE en .env}
    networks: [aplicaciones, datos]
    logging: *logs

networks:
  # red con los puertos publicados (solo el gateway)
  frontal:
  # red entre el gateway y las aplicaciones: sin salida al exterior
  aplicaciones:
    internal: true
  # red de salida hacia el servidor de base de datos
  datos:
