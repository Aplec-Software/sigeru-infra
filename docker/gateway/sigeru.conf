# =====================================================================
# Gateway de SiGeRU (Nginx). Es el único contenedor con puertos abiertos:
# recibe todo por HTTPS y reparte cada ruta al contenedor que corresponde.
#
#   /                  -> landing
#   /app/              -> frontend de usuarios
#   /backoffice/       -> backoffice (administración municipal)
#   /api/usuarios/     -> API de Usuarios
#   /api/gestion/      -> API de Gestión
#   /api/recoleccion/  -> API de Recolección
# =====================================================================

server_tokens off;
client_max_body_size 2m;

# Límites por IP: intentos de login, reportes anónimos (QR) y uso general de las APIs
limit_req_zone $binary_remote_addr zone=login:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=reportes:10m rate=12r/m;
limit_req_zone $binary_remote_addr zone=apis:10m rate=20r/s;
limit_req_status 429;

# El resolver interno de Docker permite que Nginx arranque aunque un servicio todavía no exista
resolver 127.0.0.11 valid=30s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # usado por el healthcheck del contenedor
    location = /salud {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/sigeru.crt;
    ssl_certificate_key /etc/nginx/certs/sigeru.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5:!3DES;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Encabezados de seguridad (valen para todas las aplicaciones)
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com; img-src 'self' data: https://*.tile.openstreetmap.org https://tile.openstreetmap.org https://unpkg.com; connect-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'self'" always;

    # Datos que reciben las aplicaciones sobre el cliente real
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection $connection_upgrade;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;

    location = /salud {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ------------------------------------------------------------ APIs
    location = /api/usuarios/auth/login {
        limit_req zone=login burst=10 nodelay;
        set $destino http://api-usuarios:80;
        proxy_pass $destino/auth/login;
    }
    location = /api/gestion/incidencias/qr {
        limit_req zone=reportes burst=6 nodelay;
        set $destino http://api-gestion:80;
        proxy_pass $destino/incidencias/qr;
    }
    location /api/usuarios/ {
        limit_req zone=apis burst=40 nodelay;
        rewrite ^/api/usuarios/(.*)$ /$1 break;
        set $destino http://api-usuarios:80;
        proxy_pass $destino;
    }
    location /api/gestion/ {
        limit_req zone=apis burst=40 nodelay;
        rewrite ^/api/gestion/(.*)$ /$1 break;
        set $destino http://api-gestion:80;
        proxy_pass $destino;
    }
    location /api/recoleccion/ {
        limit_req zone=apis burst=40 nodelay;
        rewrite ^/api/recoleccion/(.*)$ /$1 break;
        set $destino http://api-recoleccion:80;
        proxy_pass $destino;
    }

    # ---------------------------------------------------- Aplicaciones web
    location = /backoffice {
        return 301 /backoffice/;
    }
    location /backoffice/ {
        limit_req zone=apis burst=40 nodelay;
        rewrite ^/backoffice/(.*)$ /$1 break;
        set $destino http://backoffice:80;
        proxy_pass $destino;
        proxy_redirect off;
    }
    location = /app {
        return 301 /app/;
    }
    location /app/ {
        rewrite ^/app/(.*)$ /$1 break;
        set $destino http://frontend:80;
        proxy_pass $destino;
    }
    location / {
        set $destino http://landing:80;
        proxy_pass $destino;
    }

    error_page 502 503 504 /mantenimiento.html;
    location = /mantenimiento.html {
        internal;
        default_type text/html;
        return 503 '<!doctype html><html lang="es"><meta charset="utf-8"><title>SiGeRU</title><body style="font-family:sans-serif;text-align:center;padding:4rem;color:#17505a"><h1>SiGeRU está en mantenimiento</h1><p>Volvé a intentar en unos minutos.</p></body></html>';
    }
}
