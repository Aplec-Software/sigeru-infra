# =====================================================================
# Apache del contenedor api de SiGeRU: un sitio por API.
# El contenedor web les reenvía /api/usuarios/, /api/gestion/ y
# /api/recoleccion/ sin el prefijo, igual que el gateway de producción.
#
# Cada sitio define su propio usuario de MySQL y su log. Las contraseñas
# llegan como variables de entorno del contenedor (archivo .env) y Apache
# las toma al arrancar con la sintaxis ${VARIABLE}.
# =====================================================================
ServerTokens Prod
ServerSignature Off
TraceEnable Off
ServerName sigeru-api

# ------------------------------------------------------ API de Usuarios
<VirtualHost *:8001>
    DocumentRoot /var/www/sigeru/api-usuarios/public
    <Directory /var/www/sigeru/api-usuarios/public>
        Options -Indexes
        # usa el .htaccess del repositorio (controlador frontal)
        AllowOverride All
        Require all granted
    </Directory>
    SetEnv APP_NOMBRE api-usuarios
    SetEnv DB_USER api_usuarios
    SetEnv DB_PASS ${CLAVE_API_USUARIOS}
    SetEnv JWT_CLAVE_PRIVADA /claves/jwt_privada.pem
    SetEnv LOG_ARCHIVO /var/log/sigeru/api-usuarios-{fecha}.log
</VirtualHost>

# ------------------------------------------------------- API de Gestión
<VirtualHost *:8002>
    DocumentRoot /var/www/sigeru/api-gestion/public
    <Directory /var/www/sigeru/api-gestion/public>
        Options -Indexes
        AllowOverride All
        Require all granted
    </Directory>
    SetEnv APP_NOMBRE api-gestion
    SetEnv DB_USER api_gestion
    SetEnv DB_PASS ${CLAVE_API_GESTION}
    SetEnv LOG_ARCHIVO /var/log/sigeru/api-gestion-{fecha}.log
</VirtualHost>

# ---------------------------------------------------- API de Recolección
<VirtualHost *:8003>
    DocumentRoot /var/www/sigeru/api-recoleccion/public
    <Directory /var/www/sigeru/api-recoleccion/public>
        Options -Indexes
        AllowOverride All
        Require all granted
    </Directory>
    SetEnv APP_NOMBRE api-recoleccion
    SetEnv DB_USER api_recoleccion
    SetEnv DB_PASS ${CLAVE_API_RECOLECCION}
    SetEnv LOG_ARCHIVO /var/log/sigeru/api-recoleccion-{fecha}.log
</VirtualHost>
