# =====================================================================
# Apache del contenedor web de SiGeRU
#
#   /                  landing                 /var/www/sigeru/landing
#   /app/              frontend de usuarios    /var/www/sigeru/frontend
#   /backoffice/       backoffice (PHP)        sitio interno 127.0.0.1:8081
#   /api/usuarios/     API de Usuarios         contenedor api, puerto 8001
#   /api/gestion/      API de Gestión          contenedor api, puerto 8002
#   /api/recoleccion/  API de Recolección      contenedor api, puerto 8003
#
# Las variables ${...} las define sigeru-web-inicio al arrancar.
# =====================================================================

# No mostrar versiones ni aceptar TRACE
ServerTokens Prod
ServerSignature Off
TraceEnable Off
ServerName ${SERVIDOR_NOMBRE}
# (los logs de Apache ya salen por la salida del contenedor: docker compose logs web)

# ------------------------------------------------------------- HTTP (80)
<VirtualHost *:80>
    # el healthcheck del contenedor usa esta ruta sin TLS
    Alias /salud /var/www/sigeru/errores/salud.txt
    <Directory /var/www/sigeru/errores>
        Require all granted
    </Directory>

    # todo lo demás se redirige a HTTPS (con el puerto publicado para HTTPS)
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/salud$
    RewriteCond %{HTTP_HOST} ^([^:]+)
    RewriteRule ^ https://%1${REDIR_PUERTO}%{REQUEST_URI} [R=301,L]
</VirtualHost>

# ----------------------------------------------------------- HTTPS (443)
<VirtualHost *:443>
    SSLEngine on
    # sigeru.crt tiene el certificado del servidor seguido del de la CA de Aplec
    SSLCertificateFile      /etc/sigeru/certificados/sigeru.crt
    SSLCertificateKeyFile   /etc/sigeru/certificados/sigeru.key
    SSLProtocol             -all +TLSv1.2 +TLSv1.3
    SSLCipherSuite          HIGH:!aNULL:!MD5:!3DES
    SSLHonorCipherOrder     off
    SSLSessionTickets       off

    # pedidos de hasta 2 MB (ninguna pantalla sube archivos)
    LimitRequestBody 2097152

    # Encabezados de seguridad para todas las aplicaciones
    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "geolocation=(self), camera=(), microphone=()"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com; img-src 'self' data: https://*.tile.openstreetmap.org https://tile.openstreetmap.org https://unpkg.com; connect-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'self'"

    # Datos del cliente real para las aplicaciones. Se descarta el
    # X-Forwarded-For que venga del navegador: lo agrega Apache al reenviar.
    RequestHeader unset X-Forwarded-For early
    RequestHeader set X-Forwarded-Proto "https"
    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 60

    # Chequeo de salud y página de mantenimiento
    Alias /salud /var/www/sigeru/errores/salud.txt
    Alias /mantenimiento.html /var/www/sigeru/errores/mantenimiento.html
    <Directory /var/www/sigeru/errores>
        Require all granted
    </Directory>
    ErrorDocument 502 /mantenimiento.html
    ErrorDocument 503 /mantenimiento.html

    # Certificado de la CA de Aplec, para instalarlo en el navegador.
    # Solo se publica ese archivo: el resto de la carpeta sigue bloqueado.
    Alias /aplec-ca.crt /etc/sigeru/certificados/aplec-ca.crt
    <Directory /etc/sigeru/certificados>
        <Files "aplec-ca.crt">
            Require all granted
            ForceType application/x-x509-ca-cert
        </Files>
    </Directory>

    # --------------------------------------------------------------- APIs
    ProxyPass        /api/usuarios/    http://api:8001/ connectiontimeout=5 timeout=60
    ProxyPassReverse /api/usuarios/    http://api:8001/
    ProxyPass        /api/gestion/     http://api:8002/ connectiontimeout=5 timeout=60
    ProxyPassReverse /api/gestion/     http://api:8002/
    ProxyPass        /api/recoleccion/ http://api:8003/ connectiontimeout=5 timeout=60
    ProxyPassReverse /api/recoleccion/ http://api:8003/

    # --------------------------------------------------------- Backoffice
    # El backoffice arma sus enlaces con BASE_PATH=/backoffice, por eso no
    # hace falta reescribir sus redirecciones.
    RedirectMatch 301 ^/backoffice$ /backoffice/
    ProxyPass        /backoffice/ http://127.0.0.1:8081/ connectiontimeout=5 timeout=60

    # ----------------------------------------------------------- Frontend
    RedirectMatch 301 ^/app$ /app/
    Alias /app/ /var/www/sigeru/frontend/
    <Directory /var/www/sigeru/frontend>
        Options -Indexes
        AllowOverride None
        Require all granted
        DirectoryIndex index.html
        FallbackResource /app/index.html
    </Directory>

    # ------------------------------------------------------------ Landing
    DocumentRoot /var/www/sigeru/landing
    <Directory /var/www/sigeru/landing>
        Options -Indexes
        AllowOverride None
        Require all granted
        DirectoryIndex index.html
        FallbackResource /index.html
    </Directory>

    # El código y los textos cambian con cada versión: sin caché larga
    <FilesMatch "\.(js|css|json)$">
        Header set Cache-Control "no-cache"
    </FilesMatch>
    <FilesMatch "\.(png|jpe?g|svg|ico|webp)$">
        Header set Cache-Control "max-age=604800"
    </FilesMatch>
</VirtualHost>

# ------------------------------------------- Backoffice (sitio interno)
<VirtualHost 127.0.0.1:8081>
    DocumentRoot /var/www/sigeru/backoffice/public
    <Directory /var/www/sigeru/backoffice/public>
        Options -Indexes
        # usa el .htaccess del repositorio (controlador frontal)
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
